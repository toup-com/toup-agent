# Slack connector manifest.
#
# ── Why USER tokens and not a bot token ───────────────────────────────
# Slack's OAuth v2 issues two different tokens from one install: a BOT
# token (`xoxb-`, from the `scope` param) and a USER token (`xoxp-`,
# from `user_scope`). They are not two spellings of the same thing —
# they see different workspaces:
#
#   A bot can only read a channel it has been INVITED to, and it cannot
#   see the user's DMs at all (`im:history` for a bot means "DMs with
#   the bot"). So "what did I miss in #eng?" answers "I'm not in that
#   channel" until the user runs /invite in every channel they care
#   about, and "what did Sara DM me?" can never work.
#
#   A user token sees exactly what the user sees, and `search.messages`
#   — the single most useful thing an agent can do with Slack — is
#   user-token-only. Slack does not expose search to bots at all.
#
# It also matches every other connector here: Gmail reads your mail,
# Jira comments as you, Teams sends as you. So Toup requests USER
# scopes only, and messages it sends are from the user, not from an app.
# That is a deliberate trade: it means there is no "Toup" bot identity
# in the workspace, and a message the agent sends is indistinguishable
# from one the user typed. `slack__send_message` is therefore both
# `mutates` and `elevation` — it goes out under the user's name into a
# conversation other people are reading.
#
# The mechanical consequence is that `access_token` is NOT at the top
# level of Slack's token response — it is nested under `authed_user`.
# `ProviderAppConfig.token_lift_key` lifts it; see `_TEMPLATES["slack"]`.
#
# ── Why eleven scopes ─────────────────────────────────────────────────
# Slack partitions read access by conversation TYPE, and each type needs
# a separate list scope and history scope. There is no umbrella scope.
# Dropping `im:*` would make the connector silently blind to DMs, which
# is where most of a person's Slack actually is; dropping `mpim:*` does
# the same to group DMs. Every scope below is required by a declared
# tool — nothing is requested speculatively.
#
# Deliberately NOT requested, and each one is a real capability we are
# giving up: `files:read` (file contents), `users:read.email` (email
# addresses), `chat:write.public` (posting to channels the user has not
# joined), `reactions:write`, `channels:write`, and every `admin.*`
# scope. See `scope_descriptions` for the ones users are most likely to
# ask about.
#
# ── Status: beta ──────────────────────────────────────────────────────
# No live round-trip has been observed yet: Slack requires an app
# registered at api.slack.com/apps with our redirect URL, and public
# distribution activated before anyone outside that workspace can
# install it. Flip to `stable` after a real connect + read + send.
manifest_version: 1
id: slack
name: Slack
short_description: Read and search your Slack conversations, and send messages as you.
icon: slack
docs_url: https://api.slack.com/methods
status: beta
category: communication

oauth:
  provider_app: slack
  # Sent as `user_scope`, not `scope` — see `token_lift_key` /
  # `scope_param` in provider_apps.py. Slack's own docs call these
  # "user token scopes".
  scopes:
    - channels:read
    - channels:history
    - groups:read
    - groups:history
    - im:read
    - im:history
    - mpim:read
    - mpim:history
    - chat:write
    # Opens a DM conversation with someone the user has never messaged.
    # Without it "@sara" can only be resolved to an EXISTING DM, so
    # messaging a new person fails — and `conversations.open` is the
    # only way to get that channel id. It creates a conversation; it
    # grants no additional read.
    - im:write
    - users:read
    - search:read
  scopes_optional: []
  # Slack OAuth v2 has no PKCE. Its documented authorize parameters are
  # client_id / scope / user_scope / redirect_uri / state / team, and
  # the token endpoint takes no `code_verifier`.
  pkce: false
  # Slack user tokens do not expire unless the app owner switches on
  # "token rotation", in which case the token response carries
  # `refresh_token` + `expires_in` and the vault picks them up with no
  # change here. `provider.refresh()` implements the rotation exchange
  # so that switch is a config change rather than a code change.
  refresh: false

scope_descriptions:
  channels:read: List the public channels in your workspace.
  channels:history: Read messages in public channels you can see.
  groups:read: List the private channels you are a member of.
  groups:history: Read messages in those private channels.
  im:read: List your direct-message conversations.
  im:history: Read your direct messages.
  mpim:read: List your group direct messages.
  mpim:history: Read messages in your group direct messages.
  chat:write: Send messages as you. Anything sent appears under your own name.
  im:write: Start a direct message with someone you have not messaged before.
  users:read: Look up display names, so the agent can say "Sara" instead of "U04J1F2".
  search:read: Search your Slack history the way Slack's own search box does.
  files:read: Not requested. Would expose the contents of files shared in your workspace.
  users:read.email: Not requested. Would expose every member's email address.
  chat:write.public: Not requested. Would let messages be posted to channels you have not joined.

health:
  probe: slack__list_channels

tools:
  - name: slack__list_channels
    description: |
      List Slack conversations the user belongs to or can see — public channels, private channels, group DMs and 1:1 DMs. Returns the `id` needed by every other Slack tool. 1:1 DMs have no name; they carry `user_name` instead, so this is also how to find the conversation with a particular person. Slack returns conversations in no useful order, so filter with `types` and `name_contains` rather than paging blindly.
    input_schema:
      type: object
      properties:
        types:
          type: string
          description: 'Comma-separated subset of: public_channel, private_channel, mpim, im. Default covers all four.'
          default: public_channel,private_channel,mpim,im
        name_contains:
          type: string
          description: Case-insensitive substring filter on channel name (or the other person''s name, for a DM). Applied after fetching.
        exclude_archived:
          type: boolean
          default: true
        limit:
          type: integer
          minimum: 1
          maximum: 200
          default: 100
        cursor:
          type: string
          description: Pagination cursor from a previous call's next_cursor.
      required: []
    mutates: false
    elevation: false
    output_redaction: ["channels"]
    pii: low
    channel_policy:
      default: allow
      deny: []

  - name: slack__read_messages
    description: |
      Read recent messages from one Slack conversation, newest first. Pass a `channel` id from slack__list_channels (a `#name` or `@name` also works and is resolved for you). To read a THREAD rather than the main conversation, pass the parent message's `thread_ts` — there is no separate thread tool. Messages whose `reply_count` is above zero have a thread worth reading; the main view shows only the parent. User ids are resolved to display names.
    input_schema:
      type: object
      properties:
        channel:
          type: string
          description: Channel id (C…/G…/D…), or "#general", or "@sara".
        thread_ts:
          type: string
          description: Timestamp of a parent message. When set, returns that thread's replies instead of the channel's main messages.
        limit:
          type: integer
          minimum: 1
          maximum: 200
          default: 30
        oldest:
          type: string
          description: Unix timestamp (seconds, may be fractional). Only messages at or after this point. Use for "since yesterday".
        since_last_read:
          type: boolean
          default: false
          description: Start from where the user last read this conversation. Ignored when `oldest` is given or when reading a thread. Costs one extra call, and quietly does nothing if Slack will not report read state for this conversation.
        mentions_only:
          type: boolean
          default: false
          description: Keep only messages that name the user with a real <@user> mention. Fails with an explanation if the connection cannot say who the user is — it never widens to the whole channel instead.
        threads_only:
          type: boolean
          default: false
          description: Keep only threads the user has replied in, judged from Slack's reply_users, which lists at most five people. Ignored when reading one thread.
        cursor:
          type: string
          description: Pagination cursor from a previous call's next_cursor.
      required: [channel]
    mutates: false
    elevation: false
    output_redaction: ["messages"]
    pii: high
    channel_policy:
      default: allow
      deny: []

  - name: slack__search_messages
    description: |
      Search the user's whole Slack history — every channel and DM they can see — using Slack's own search syntax. Supports modifiers like `in:#eng`, `from:@sara`, `before:2026-08-01`, `has:link` and quoted phrases. This is the right first move for "find the message where…" or "what did we decide about…"; it is far cheaper than reading channels one at a time.
    input_schema:
      type: object
      properties:
        query:
          type: string
          description: 'Search terms plus optional Slack modifiers, e.g. ''deploy plan in:#eng from:@sara''.'
        sort:
          type: string
          enum: [score, timestamp]
          description: score = most relevant (default), timestamp = most recent.
          default: score
        count:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
        page:
          type: integer
          minimum: 1
          default: 1
      required: [query]
    mutates: false
    elevation: false
    output_redaction: ["matches"]
    pii: high
    channel_policy:
      default: allow
      deny: []

  - name: slack__send_message
    description: |
      Send a Slack message AS THE USER — it appears under their own name and photo, indistinguishable from one they typed. Pass a `channel` id from slack__list_channels, or "#general", or "@sara" (a DM conversation is opened if one does not exist). Set `thread_ts` to reply inside a thread instead of posting to the channel. Slack `mrkdwn` is supported: *bold*, _italic_, `code`, <https://url|label>, and <@U123> to mention someone.
    input_schema:
      type: object
      properties:
        channel:
          type: string
          description: Channel id (C…/G…/D…), or "#general", or "@sara".
        text:
          type: string
          description: Message body, in Slack mrkdwn.
        thread_ts:
          type: string
          description: Parent message timestamp. When set, the message is posted as a threaded reply.
        reply_broadcast:
          type: boolean
          description: With thread_ts, also show the reply in the main channel. Ignored otherwise.
          default: false
      required: [channel, text]
    mutates: true
    elevation: true
    rate_limit: 10/min
    output_redaction: []
    pii: high
    channel_policy:
      default: allow
      deny: []

  - name: slack__list_users
    description: |
      List members of the Slack workspace with their display names, real names, ids and whether they are a bot or deactivated. Use it to turn "Sara" into the `@name` or user id that slack__send_message and search's `from:` modifier need. Deactivated members and bots are excluded by default. Email addresses are never returned — Toup does not request that scope.
    input_schema:
      type: object
      properties:
        name_contains:
          type: string
          description: Case-insensitive substring matched against display name, real name and handle.
        include_bots:
          type: boolean
          default: false
        include_deactivated:
          type: boolean
          default: false
        limit:
          type: integer
          minimum: 1
          maximum: 200
          default: 100
        cursor:
          type: string
          description: Pagination cursor from a previous call's next_cursor.
      required: []
    mutates: false
    elevation: false
    output_redaction: ["users"]
    pii: medium
    channel_policy:
      default: allow
      deny: []

  - name: slack__conversation_info
    description: |
      Everything Slack knows about ONE conversation: its name or the person on the other end, its topic, whether it is archived, and — for a conversation this account is a member of — the read state: `last_read`, `unread_count` and `unread_count_display`. Read state is the one thing `slack__list_channels` cannot give you, which is why "52 messages overnight" needs this call. Check `unread_supported` before believing a zero: Slack declines to report read state for some conversations, and absent is not the same as nothing unread.
    input_schema:
      type: object
      properties:
        channel:
          type: string
          description: Channel id (C…/G…/D…), or "#general", or "@sara".
        include_num_members:
          type: boolean
          default: false
      required: [channel]
    mutates: false
    elevation: false
    output_redaction: ["latest"]
    pii: medium
    channel_policy:
      default: allow
      deny: []

  - name: slack__list_dms
    description: |
      The user's direct-message conversations, most unread first, each with who it is with, the newest message in it, and how many are unread. Use it for "who has written to me", for "did Sara reply", and to find the conversation with a particular person without paging every channel. The row whose `is_self` is true is the user's own saved-messages DM — the only conversation a message can be delivered to without involving another person. Each conversation costs one or two extra API calls, so `limit` is a real budget, not a display cap.
    input_schema:
      type: object
      properties:
        limit:
          type: integer
          minimum: 1
          maximum: 25
          default: 15
          description: How many conversations to open and describe.
        with_unread:
          type: boolean
          default: true
          description: Fetch read state per conversation. Costs one extra call each.
        types:
          type: string
          default: im,mpim
          description: 'im (1:1), mpim (group DM), or both.'
      required: []
    mutates: false
    elevation: false
    output_redaction: ["dms"]
    pii: high
    channel_policy:
      default: allow
      deny: []

  - name: slack__list_mentions
    description: |
      Messages anywhere in the workspace that name the connected user — "@you" — newest first. This is the "what is waiting on me" read: it needs no channel, because it resolves the user's own handle at call time and searches on it. Messages that merely contain the name as text are dropped unless `strict` is false, and the user's own messages are never returned.
    input_schema:
      type: object
      properties:
        limit:
          type: integer
          minimum: 1
          maximum: 100
          default: 30
        query:
          type: string
          description: 'Extra Slack search modifiers to narrow it, e.g. ''in:#eng after:2026-08-30''.'
        strict:
          type: boolean
          default: true
          description: Keep only real <@user> mentions. False also keeps plain-text name matches.
      required: []
    mutates: false
    elevation: false
    output_redaction: ["mentions"]
    pii: high
    channel_policy:
      default: allow
      deny: []

  - name: slack__list_threads
    description: |
      Threads the user is in, and when each one last moved. With `channel`, the threads under that conversation. Without one, the threads the user has REPLIED in anywhere — found from their own messages, so it needs no channel and no pin. Each row carries the parent message, the reply count and `latest_reply`, the timestamp of the newest reply. Read a thread's contents with slack__read_messages and the `thread_ts` returned here.
    input_schema:
      type: object
      properties:
        channel:
          type: string
          description: Optional. Channel id, "#general" or "@sara". Omit for every thread the user has replied in.
        limit:
          type: integer
          minimum: 1
          maximum: 25
          default: 10
        only_mine:
          type: boolean
          default: true
          description: Keep only threads the user has replied in. With `channel`, this is judged from Slack's reply_users, which lists at most five people.
        scan:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
          description: With `channel`, how many recent messages to scan for threads.
      required: []
    mutates: false
    elevation: false
    output_redaction: ["threads"]
    pii: high
    channel_policy:
      default: allow
      deny: []

  - name: slack__whoami
    description: |
      Who this Slack connection belongs to — the user's own Slack id, handle, workspace name and workspace id. Use it to tell the user's own messages from everyone else's, to build a `from:` or mention query, and to confirm which workspace is connected. Needs no scope.
    input_schema:
      type: object
      properties: {}
      required: []
    mutates: false
    elevation: false
    output_redaction: []
    pii: medium
    channel_policy:
      default: allow
      deny: []

# ── Automation capability (Round 26; polling added R43) ────────────
# Still no push path: Slack's Events API needs an app-level
# subscription we don't provision.
#
# Polling was refused in R26 as "a privacy hazard at rest", and R43
# reverses that deliberately. The hazard was a poll over the whole
# workspace; this one reads ONE conversation the user pinned, with the
# same user token they already granted history scopes to, and stores
# only the dedupe key plus the declared fields. The alternative was a
# Slack column of instant triggers that could never fire.
#
# R43 W3-A adds the four §7 rows. The earlier note here said they had
# nothing to bind to, and that was true of the tool surface as it stood:
# `conversations.history` reads a single conversation, so "I am
# @mentioned" needed the user's own handle (nothing answered
# `auth.test`), "a DM arrives" needed a DM listing, and "a thread I am
# in moves" needed a `thread_ts` the pin vocabulary cannot supply.
# `slack__list_mentions`, `slack__list_dms` and `slack__list_threads`
# are exactly those three surfaces, each resolving the owner's identity
# at CALL time rather than asking an automation author to hard-code it.
#
# No new scope: all three read under `search:read`, `im:read`/
# `im:history` and the `channels:*`/`groups:*` pairs this connector has
# always requested. `auth.test` needs no scope at all.
#
# `channel_message` stays, and stays first: it is the only row that
# means "the place I pinned", and `oncall_message` below is a
# deliberately literal special case of it.
#
# Writes stay grant-gated to ONE pinned channel.
automation:
  push: false
  poll: true
  floor_s: 300
  rate_budget:
    per_hour: 30
    per_day: 200
  scopes_read:
    - channels:read
    - channels:history
    - groups:read
    - groups:history
    - im:read
    - im:history
    - mpim:read
    - mpim:history
    - users:read
    # `slack__list_mentions` and the account-wide half of
    # `slack__list_threads` are both `search.messages` calls.
    - search:read
  scopes_write_by_action:
    slack__send_message: ["chat:write"]
  target_param_by_action:
    slack__send_message: channel
  events:
    - key: channel_message
      description: >-
        A message arrives in one Slack conversation you pick — a
        channel, a group or a DM. `channel` comes from the canvas pin.
      source_tool: slack__read_messages
      poll_args:
        limit: 30
      params_required: [channel]
      items_path: messages
      # `ts` is unique inside a conversation, and a source lane polls
      # exactly one conversation, so it cannot collide with another
      # channel's message.
      dedupe_field: ts
      fields:
        ts: ts
        from: from
        text: text
    - key: mentioned
      description: Someone names you in any conversation you can see.
      source_tool: slack__list_mentions
      poll_args:
        limit: 30
        strict: true
      items_path: mentions
      # The permalink, not `ts`: a Slack timestamp is unique inside ONE
      # conversation and this window spans the whole workspace, so two
      # channels can hand back the same key.
      dedupe_field: permalink
      # The dedupe key is COLLECTED, not just computed: an event whose
      # payload cannot say what it deduped on is unauditable.
      fields:
        permalink: permalink
        ts: ts
        from: from
        channel: channel_name
        text: text
        url: permalink
    - key: dm_arrived
      description: A new message arrives in one of your direct messages.
      source_tool: slack__list_dms
      poll_args:
        limit: 15
        # The trigger only needs "did the newest message change", and
        # read state costs a second call per conversation.
        with_unread: false
      items_path: dms
      # One item per CONVERSATION, keyed on its newest message — so a
      # burst of six replies from one person while the poller sleeps is
      # one event, not six. A DM with no messages yet answers null here
      # and the engine skips it.
      dedupe_field: latest_ts
      fields:
        latest_ts: latest_ts
        channel: channel
        from: user_name
        text: latest_text
        ts: latest_ts
    - key: thread_moved
      description: A thread you have replied in gets a new reply.
      source_tool: slack__list_threads
      poll_args:
        limit: 10
        only_mine: true
      items_path: threads
      # `latest_reply` moves on every new reply; `thread_ts` would fire
      # once in the automation's life, which is the opposite of "moves".
      dedupe_field: latest_reply
      fields:
        latest_reply: latest_reply
        channel: channel
        thread: thread_ts
        from: parent_from
        text: parent_text
        replies: reply_count
    - key: oncall_message
      description: A message arrives in the channel named #oncall.
      source_tool: slack__read_messages
      # Literal, and needs no pin — that is the whole difference from
      # `channel_message`, and it is the reason the row can say "#oncall"
      # rather than "the channel you picked". A workspace whose on-call
      # channel is named anything else (#oncall-handover, #on-call) has
      # no channel called `oncall`, the read says so in words, and
      # `channel_message` with a pin is the row for it.
      poll_args:
        channel: "#oncall"
        limit: 30
      items_path: messages
      dedupe_field: ts
      fields:
        ts: ts
        from: from
        text: text
