# Stub connector — test harness for T1c registry tests and T1d OAuth
# flow tests. Excluded from production by `status: experimental`
# (default load filters it out).
#
# NOTE on the name: the operator's T1c spec said `_stub` (underscore-
# prefix) for the directory. The tool-name regex
# `^[a-z][a-z0-9]*__[a-z0-9_]+$` requires letter-start, so an
# underscore-prefixed manifest id wouldn't validate. Renamed to `stub`;
# the experimental status filter is the actual production gate.
manifest_version: 1
id: stub
name: Stub
short_description: Test-only connector for the OAuth flow harness (T1d).
status: experimental
category: test

oauth:
  provider_app: stub_provider_app
  scopes: []
  scopes_optional: []
  pkce: true
  refresh: true

health:
  probe: stub__echo

tools:
  - name: stub__echo
    description: Echo the input back. Used by tests to verify dispatch.
    input_schema:
      type: object
      properties:
        message:
          type: string
      required:
        - message
    mutates: false
    elevation: false
    output_redaction: []
    channel_policy:
      default: allow
      deny: []
  - name: stub__list_items
    description: Deterministic three-item feed for the automations e2e harness.
    input_schema:
      type: object
      properties: {}
    mutates: false
    elevation: false
    output_redaction: []
    channel_policy:
      default: allow
      deny: []
  - name: stub__post
    description: Test-only write. Echoes its arguments back; the harness asserts on them.
    input_schema:
      type: object
      properties:
        channel:
          type: string
        text:
          type: string
      required: [channel, text]
    mutates: true
    elevation: false
    output_redaction: []
    channel_policy:
      default: allow
      deny: []

# ── Automation capability (Round 26) ──────────────────────────────
# The e2e harness's connector: a real poll event and a real pinned
# write, no network. `status: experimental` keeps all of it out of
# production registries.
automation:
  push: false
  poll: true
  floor_s: 300
  rate_budget:
    per_hour: 60
    per_day: 500
  scopes_read: []
  scopes_write_by_action:
    stub__post: []
  target_param_by_action:
    stub__post: channel
  events:
    - key: item_created
      description: A new item appears in the stub feed.
      source_tool: stub__list_items
      poll_args: {}
      items_path: items
      dedupe_field: id
      fields:
        id: id
        title: title
