# Outlook (Microsoft 365) mail connector — manifest.
#
# Scopes lifted from Microsoft Graph's permission catalogue:
#   - Mail.Read     — list + read messages
#   - Mail.Send     — send mail
#   - User.Read     — needed for /me/messages to identify the mailbox
#   - offline_access — issue a refresh_token
#
# All four are "delegated" permissions (user-consent only, no admin
# consent needed for personal Microsoft accounts and most Azure AD
# tenants).
manifest_version: 1
id: outlook
name: Outlook
short_description: Read your inbox, search threads, and send messages from your Outlook / Microsoft 365 mailbox.
icon: mail
docs_url: https://learn.microsoft.com/en-us/graph/api/resources/mail-api-overview
status: stable
category: productivity

oauth:
  provider_app: microsoft
  scopes:
    - https://graph.microsoft.com/Mail.Read
    - https://graph.microsoft.com/Mail.ReadWrite
    - https://graph.microsoft.com/Mail.Send
    - https://graph.microsoft.com/User.Read
    - offline_access
  scopes_optional: []
  pkce: true
  refresh: true

scope_descriptions:
  https://graph.microsoft.com/Mail.Read: Read your Outlook mail.
  https://graph.microsoft.com/Mail.ReadWrite: Save drafts to your Outlook mailbox (never sends).
  https://graph.microsoft.com/Mail.Send: Send mail on your behalf.
  https://graph.microsoft.com/User.Read: Read your basic profile (mailbox address, display name).
  offline_access: Refresh tokens so we don't ask you to sign in every hour.

health:
  probe: outlook__list_messages

tools:
  - name: outlook__list_messages
    description: |
      List recent Outlook messages, newest first. Narrow by `query` (Graph's KQL search, e.g. "from:alice@contoso.com") and/or `is_read`. Returns full headers + body for every message in ONE call by default. Only set `include_body: false` for rare bulk-enumeration. For "Nth email" requests, set `max_results` to N and pick the Nth from the response — ONE tool call, not list-then-get.
    input_schema:
      type: object
      properties:
        query:
          type: string
          description: |
            Microsoft Graph KQL search over the mailbox — free text, or one of the property restrictions message search supports: from:, to:, subject:, body:, hasAttachments:, received: (e.g. "from:alice@contoso.com", "subject:invoice"). This is NOT an OData $filter: "isRead eq false" here is searched as that literal phrase and matches nothing — use `is_read` for read/unread, which Graph cannot express in a search at all. Omit for the whole mailbox.
        folder:
          type: string
          description: |
            Read ONE mail folder instead of the whole mailbox. Either a folder id from `outlook__list_folders`, or one of Graph's well-known names: inbox, archive, sentitems, drafts, deleteditems, junkemail. Omit for every folder. This is a real scope — `query` is a KQL search and cannot name a folder.
        to_me:
          type: boolean
          description: true = only mail addressed to this mailbox (searched as KQL `to:<your address>`). The address is resolved from the connected account; omit for everything that arrived.
        is_read:
          type: boolean
          description: false = unread only, true = read only; omit for both.
        since:
          type: string
          description: 'Only messages received at or after this instant (ISO 8601, e.g. "2026-08-30T00:00:00Z"). Use for "since yesterday" / "today''s mail".'
        max_results:
          type: integer
          minimum: 1
          maximum: 50
          description: Number of messages to return. For "show me my last N emails" or "summarize my Nth email", set this to N. Default 25 covers most asks in one call.
          default: 25
        include_body:
          type: boolean
          description: Defaults to true — Graph returns the body inline via $select=body. Set to false ONLY for bulk-enumeration tasks where bodies aren't needed.
          default: true
      required: []
    mutates: false
    elevation: false
    output_redaction: ["bodyPreview", "body"]
    pii: medium
    channel_policy:
      default: allow
      deny: []

  - name: outlook__list_folders
    description: |
      List the mail folders in this mailbox — Inbox, Archive, Sent Items and every folder the user made themselves — each with how many messages it holds and how many are unread. Use this to answer "which folders do I have", or to turn a folder NAME the user said into the id `outlook__list_messages` takes as `folder`. Inbox / Archive / Sent Items lead the list and carry `well_known`, identified by ID rather than by display name (which is localised).
    input_schema:
      type: object
      properties:
        max_results:
          type: integer
          minimum: 1
          maximum: 50
          description: How many folders to return. Default 25.
          default: 25
      required: []
    mutates: false
    elevation: false
    output_redaction: []
    pii: low
    channel_policy:
      default: allow
      deny: []

  - name: outlook__get_message
    description: Fetch the full body, headers, and metadata of one Outlook message by id.
    input_schema:
      type: object
      properties:
        message_id:
          type: string
      required: [message_id]
    mutates: false
    elevation: false
    output_redaction: ["body"]
    pii: high
    channel_policy:
      default: allow
      deny: []

  - name: outlook__create_draft
    description: |
      Compose a draft in the user's Outlook Drafts folder. NOTHING is sent — the user reviews and sends it themselves from Outlook. This is the only mail-writing action automations may use. Can carry files via `attachments` — that is how a one-page PDF, a CSV or a markdown file reaches the user as a FILE rather than as text pasted into the body.
    input_schema:
      type: object
      properties:
        to:
          type: string
          description: Recipient email address (single).
        subject:
          type: string
        body:
          type: string
        cc:
          type: string
        bcc:
          type: string
        is_read:
          type: boolean
          description: Mark the draft read (true) or unread (false) as it is created. Omit to leave Outlook's own default. A brief delivered to the user's own mailbox sets true — it is a record, not a new thing to open.
        attachments:
          type: array
          maxItems: 3
          description: Files to attach. At most 3, and at most 3 MB decoded in total — Microsoft Graph's inline `fileAttachment` ceiling; anything larger needs an upload session this connector does not open. A malformed entry refuses the whole draft rather than writing one silently missing its file.
          items:
            type: object
            properties:
              filename:
                type: string
                description: Name the file arrives under, e.g. "brief.pdf".
              content_type:
                type: string
                description: MIME type, e.g. "application/pdf". Defaults to application/octet-stream.
              content_base64:
                type: string
                description: The file's bytes, base64-encoded (standard alphabet, padded).
            required: [filename, content_base64]
      required: [to, subject, body]
    mutates: true
    elevation: false
    output_redaction: ["body", "cc", "bcc", "attachments"]
    pii: high
    rate_limit: "10/min"
    channel_policy:
      default: allow
      deny: []

  - name: outlook__send_message
    description: Compose and send an Outlook message. Subject and body are required.
    input_schema:
      type: object
      properties:
        to:
          type: string
          description: Recipient email address (single).
        subject:
          type: string
        body:
          type: string
        cc:
          type: string
        bcc:
          type: string
      required: [to, subject, body]
    mutates: true
    elevation: true
    output_redaction: ["body", "cc", "bcc"]
    pii: high
    rate_limit: "10/min"
    channel_policy:
      default: allow
      deny: []

# ── Automation capability (Round 28; drafts added Round 29) ─────────
# Honest metadata: Microsoft Graph change-notification webhooks are
# NOT provisioned in this codebase, so push is false; events arrive by
# poll. ONE write action: outlook__create_draft (R29 §5) — a draft is
# inert, the user sends it themselves; outlook__send_message stays
# rail-forbidden (_FORBIDDEN_TOOLS + no send grant is ever minted).
# The draft scope truth: Mail.ReadWrite was added to the OAuth block
# in R29, so pre-R29 connections do NOT carry it — grant-request
# creation refuses with `scope_missing` until the user reconnects.
automation:
  push: false
  poll: true
  floor_s: 300
  rate_budget:
    per_hour: 12
    per_day: 100
  scopes_read:
    - https://graph.microsoft.com/Mail.Read
  scopes_write_by_action:
    outlook__create_draft:
      - https://graph.microsoft.com/Mail.ReadWrite
  target_param_by_action:
    outlook__create_draft: to
  events:
    - key: email_received
      description: A new email arrives in your Outlook inbox.
      source_tool: outlook__list_messages
      poll_args:
        max_results: 25
      items_path: messages
      dedupe_field: id
      fields:
        id: id
        subject: subject
        from: from
        preview: preview
        received_at: received_at
    # R43 §7. `kind:` is Graph's own KQL property restriction, so a
    # meeting request is separable from ordinary mail without an OData
    # $filter this tool does not forward. §7's third Outlook event, "a
    # vendor thread moves", is NOT here: it needs a KQL query naming the
    # vendors, and `_EVENT_PARAM_PINS` has no pin kind that can fill a
    # free-text query, so the row would refuse forever.
    - key: meeting_request
      description: A meeting invitation arrives in your Outlook mail.
      source_tool: outlook__list_messages
      poll_args:
        query: kind:meetings
        max_results: 25
      items_path: messages
      dedupe_field: id
      fields:
        id: id
        subject: subject
        from: from
        preview: preview
        received_at: received_at
