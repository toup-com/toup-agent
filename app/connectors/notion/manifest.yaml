# Notion connector manifest.
#
# ── Why `scopes: []` ──────────────────────────────────────────────────
# Notion has no OAuth scopes. Its authorize endpoint accepts exactly
# `client_id`, `redirect_uri`, `response_type`, `owner` and `state` —
# there is no `scope` parameter to send and none comes back in the token
# response. Access is granted along two other axes, both set OUTSIDE
# this manifest:
#
#   1. Capabilities (read content / update content / insert content, and
#      how much user data) — chosen once by whoever owns the Notion
#      integration, in Notion's connection settings, not per user.
#   2. Per-page sharing — the user picks which pages and databases the
#      connection may see, on the consent screen and afterwards from a
#      page's ⋯ → Connections menu.
#
# So an empty scope list is the honest declaration, and a permission
# failure here can NEVER be fixed by re-authorizing with a bigger scope
# set. That is why `provider.py` never returns ConnectorScopeMissing —
# see the long comment on `_handle_notion_error`.
#
# ── Status: beta ──────────────────────────────────────────────────────
# Deliberate. Notion's token exchange needs HTTP Basic auth and a JSON
# body, which `app/api/oauth.py::_exchange_code_for_tokens` does not yet
# send (it posts form fields). Until that lands, this connector cannot
# complete a connect, so it must not present itself as `stable`. Flip to
# `stable` once a live round-trip has been observed.
manifest_version: 1
id: notion
name: Notion
short_description: Search your Notion workspace, read pages and databases, and create new pages.
icon: notion
docs_url: https://developers.notion.com/reference/intro
status: beta
category: productivity

oauth:
  provider_app: notion
  scopes: []
  scopes_optional: []
  # Notion's documented public-integration flow has no PKCE: the
  # authorize URL takes no `code_challenge`, and the token endpoint's
  # body accepts only `grant_type` / `code` / `redirect_uri`. Sending a
  # `code_verifier` risks a `validation_error` on the one request the
  # whole connect depends on.
  pkce: false
  # Notion issues a rotating refresh_token. It also returns NO
  # `expires_in`, so the vault stores `access_expires_at = NULL` and the
  # dispatcher's `_needs_refresh` never fires — in practice a dead token
  # surfaces as a 401 → reauth. `provider.refresh()` is implemented
  # correctly anyway so the path works the day Notion starts expiring
  # tokens for our client.
  refresh: true

health:
  probe: notion__search

tools:
  - name: notion__search
    description: |
      Search the connected Notion workspace for pages and databases by title. Only content the user has explicitly shared with this connection is visible — an empty result usually means "not shared yet", not "does not exist". Returns ids, titles and URLs; use notion__get_page_content to read a page's body. Each result also carries state ("active", "archived" or "in_trash") and change_key ("<page id>@<last edited time>"), which changes only when the page does. Search cannot narrow by person or by time — use notion__query_database for either.
    input_schema:
      type: object
      properties:
        query:
          type: string
          description: Title search term. Omit or leave empty to list everything shared with the connection.
        filter:
          type: string
          enum: [any, page, data_source]
          description: Restrict results to pages or to databases. Notion calls a database's queryable table a "data source".
          default: any
        sort:
          type: string
          enum: [relevance, last_edited_desc, last_edited_asc]
          description: Omit for Notion's default ordering. Use last_edited_desc for "what did I work on recently".
        page_size:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
        start_cursor:
          type: string
          description: Pagination cursor from a previous call's next_cursor.
      required: []
    mutates: false
    elevation: false
    output_redaction: ["results"]
    pii: medium
    channel_policy:
      default: allow
      deny: []

  - name: notion__get_page
    description: |
      Fetch one Notion page's properties (title, status, dates, select values, relations…) by id or Notion URL. Returns metadata only — this endpoint does NOT return the page body; call notion__get_page_content for that.
    input_schema:
      type: object
      properties:
        page_id:
          type: string
          description: Page id (dashed or undashed) or a full Notion page URL.
      required: [page_id]
    mutates: false
    elevation: false
    output_redaction: ["properties"]
    pii: medium
    channel_policy:
      default: allow
      deny: []

  - name: notion__get_page_content
    description: |
      Read a Notion page's body as plain text. Walks the page's block children, including nested blocks, and renders them with light markdown (headings, lists, checkboxes, code fences). Linked sub-pages are listed by title but not expanded. Long pages are truncated; the response says so.
    input_schema:
      type: object
      properties:
        page_id:
          type: string
          description: Page id (dashed or undashed) or a full Notion page URL.
        max_chars:
          type: integer
          minimum: 500
          maximum: 100000
          description: Stop reading once this many characters have been collected.
          default: 40000
      required: [page_id]
    mutates: false
    elevation: false
    output_redaction: ["content"]
    pii: high
    channel_policy:
      default: allow
      deny: []

  - name: notion__query_database
    description: |
      Query a Notion database and return its rows with properties flattened to plain values. Accepts either a database id/URL or a data source id. `filter` and `sorts` take Notion's own query syntax, e.g. filter {"property":"Status","status":{"equals":"Done"}} and sorts [{"property":"Due","direction":"ascending"}]. Omit both to list everything. `edited_since` and `assigned_to_me` are composed onto whatever `filter` you pass, never instead of it. Every row carries state, change_key, deadline_key ("<page id>@<its date>", so it moves only when the date moves) and people (the person ids named on it).
    input_schema:
      type: object
      properties:
        database_id:
          type: string
          description: Database id (dashed or undashed) or a full Notion database URL. Resolved to its data source automatically.
        data_source_id:
          type: string
          description: Data source id, when you already have one (from notion__search results). Takes precedence over database_id.
        filter:
          type: object
          description: Notion filter object. See https://developers.notion.com/reference/filter-data-source-entries
        sorts:
          type: array
          description: Notion sorts array, e.g. [{"property":"Due","direction":"ascending"}].
          items:
            type: object
        page_size:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
        edited_since:
          type: string
          description: ISO timestamp — only rows edited on or after it. Sorts newest-edited first unless you pass your own sorts.
        assigned_to_me:
          type: boolean
          description: Only rows naming you in a person column (any of them). Fails with an explanation if the connection cannot say who you are or the table has no person column — it never widens to the whole table instead.
          default: false
        start_cursor:
          type: string
          description: Pagination cursor from a previous call's next_cursor.
      required: []
    mutates: false
    elevation: false
    output_redaction: ["results"]
    pii: medium
    channel_policy:
      default: allow
      deny: []

  - name: notion__append_blocks
    description: |
      Append content to the END of an existing Notion page. Use this to add to a page that already exists — a running log, a daily brief, a notes page — rather than notion__create_page, which makes a NEW child page every time. Nothing already on the page is edited or removed; the append only ever adds to the bottom, so the user can edit or delete what was added. `heading` writes one heading above the appended text, which is how "under today's date" is done: pass the date as the heading.
    input_schema:
      type: object
      properties:
        page_id:
          type: string
          description: Page to append to (id or Notion URL). This is the parameter an automation grant is pinned to.
        heading:
          type: string
          description: Optional heading written immediately above the appended text — e.g. today's date.
        content:
          type: string
          description: Text to append. Each line becomes its own paragraph.
      required: [page_id]
    mutates: true
    elevation: true
    output_redaction: ["heading", "content"]
    pii: medium
    rate_limit: "10/min"
    channel_policy:
      default: allow
      deny: []

  - name: notion__create_page
    description: |
      Create a Notion page. Give exactly one parent — parent_page_id to nest it under a page, or parent_database_id / parent_data_source_id to add a row to a database. `content` becomes the page body as paragraphs. For a database parent, extra column values go in `properties` using Notion's property-value syntax; the title column is filled from `title` and does not need to be repeated.
    input_schema:
      type: object
      properties:
        parent_page_id:
          type: string
          description: Create as a child of this page (id or Notion URL).
        parent_database_id:
          type: string
          description: Create as a row in this database (id or Notion URL).
        parent_data_source_id:
          type: string
          description: Create as a row in this data source, when you already have its id.
        title:
          type: string
          description: The page title. Written into the parent's title column automatically.
        content:
          type: string
          description: Page body as plain text. Blank lines separate paragraphs.
        properties:
          type: object
          description: Extra column values for a database parent, keyed by column name, in Notion's property-value syntax, e.g. {"Status":{"status":{"name":"Todo"}}}.
      required: [title]
    mutates: true
    elevation: true
    output_redaction: ["title", "content", "properties"]
    pii: medium
    rate_limit: "10/min"
    channel_policy:
      default: allow
      deny: []

# ── Automation capability (Round 28, extended R43) ────────────────
# Notion has no webhooks for public integrations — poll only. Notion
# OAuth has no granular scopes (empty lists are the truth); the grant
# is still the write gate, pinned to one page or one parent page.
#
# R43 added a second write and two events, and NO scope moved, because
# there are none to move: what an append may do is decided by the
# integration's "insert content" capability and by which pages the user
# shared with the connection, both of them outside this file.
#
# The two events R28 could not declare are declared now, and the reason
# each was blocked is gone rather than argued around:
#
#   `page_changed` was blocked because dedupe on `last_edited_time`
#   alone collapses two pages edited in the same minute into one event.
#   The key is `change_key` — "<page id>@<last edited>" — which is
#   unique per page per minute. It polls `notion__query_database` with
#   `assigned_to_me`, so the row it announces really is one tagged to
#   the user rather than any page in the workspace; that is why it
#   requires a database to be pinned.
#
#   `deadline_moved` was blocked because "an edit" and "a deadline
#   moved" were the same signal. `deadline_key` is
#   "<page id>@<the row's date>", so it changes when the DATE changes
#   and not when the body does, and a row carrying no date answers None
#   and never fires.
automation:
  push: false
  poll: true
  floor_s: 300
  rate_budget:
    per_hour: 12
    per_day: 100
  scopes_read: []
  scopes_write_by_action:
    notion__create_page: []
    notion__append_blocks: []
  target_param_by_action:
    notion__create_page: parent_page_id
    notion__append_blocks: page_id
  events:
    - key: page_added
      description: >-
        A page is seen for the first time in your workspace search
        (Notion offers no created-time feed, so edits to old pages can
        also surface a page once).
      source_tool: notion__search
      poll_args:
        page_size: 25
      items_path: results
      dedupe_field: id
      fields:
        id: id
        title: title
        url: url
        last_edited_time: last_edited_time
    - key: page_changed
      description: A row tagged to you, in a database you pick, is edited.
      source_tool: notion__query_database
      poll_args:
        page_size: 25
        assigned_to_me: true
      params_required: [database_id]
      items_path: results
      dedupe_field: change_key
      fields:
        id: id
        title: title
        url: url
        change_key: change_key
        last_edited_time: last_edited_time
    - key: deadline_moved
      description: >-
        A date on a row in a database you pick moves. Rows with no date
        property never fire.
      source_tool: notion__query_database
      poll_args:
        page_size: 25
      params_required: [database_id]
      items_path: results
      dedupe_field: deadline_key
      fields:
        id: id
        title: title
        url: url
        deadline_key: deadline_key
