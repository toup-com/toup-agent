# T3d — Google Drive connector manifest.
manifest_version: 1
id: drive
name: Google Drive
short_description: Create docs in your Drive, and read the files you share with it.
icon: cloud
docs_url: https://developers.google.com/drive/api/v3/reference
status: stable
category: productivity

oauth:
  provider_app: google
  scopes:
    - https://www.googleapis.com/auth/drive.file
  scopes_optional:
    - https://www.googleapis.com/auth/drive.readonly
  pkce: true
  refresh: true

scope_descriptions:
  https://www.googleapis.com/auth/drive.file: Read and write files the agent creates or that you explicitly share with it.
  https://www.googleapis.com/auth/drive.readonly: Read every file in your Drive (broad read access; only enable if you want full search).

health:
  probe: drive__list_files

tools:
  - name: drive__list_files
    description: >-
      List ONLY the Drive files this agent created, or that the user explicitly
      picked for it. This is NOT a search of the user's Drive — the drive.file
      scope cannot see their other files, so an empty result means "not visible
      to me", never "does not exist". To reach a file the user already owns, ask
      them to paste its link instead.
    input_schema:
      type: object
      properties:
        query:
          type: string
          description: 'Drive search query (e.g. "mimeType=''application/pdf''").'
        max_results:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      required: []
    mutates: false
    elevation: false
    output_redaction: []
    pii: medium
    channel_policy:
      default: allow
      deny: []

  - name: drive__get_file_text
    description: >-
      Fetch the text of a Drive file by id. Works for plain text, Google Docs
      (exported as plain text) and PDFs. Limited to files this agent created or
      the user explicitly picked; anything else returns 404 for lack of access,
      not because it is missing.
    input_schema:
      type: object
      properties:
        file_id:
          type: string
      required: [file_id]
    mutates: false
    elevation: false
    output_redaction: ["text"]
    pii: high
    channel_policy:
      default: allow
      deny: []

  - name: drive__create_doc
    description: Create a Google Doc with the given title and body text, in the user's Drive root.
    input_schema:
      type: object
      properties:
        title:
          type: string
        body:
          type: string
      required: [title, body]
    mutates: true
    elevation: true
    output_redaction: ["body"]
    pii: high
    rate_limit: "10/min"
    channel_policy:
      default: allow
      deny: []

# ── Automation capability (Round 28) ──────────────────────────────
# Poll only (no webhook/watch channel provisioned). The drive.file
# scope means the feed honestly covers only files the agent created or
# was explicitly given — the event description says so. NO write
# actions: drive__create_doc takes only title/body, so there is no
# stable target parameter a grant could pin — excluded rather than
# half-gated.
automation:
  push: false
  poll: true
  floor_s: 300
  rate_budget:
    per_hour: 12
    per_day: 100
  scopes_read:
    - https://www.googleapis.com/auth/drive.file
  scopes_write_by_action: {}
  target_param_by_action: {}
  events:
    - key: file_added
      description: >-
        A file the agent can see (created by it, or shared with it —
        the drive.file scope's honest reach) appears in Drive.
      source_tool: drive__list_files
      poll_args:
        max_results: 25
      items_path: files
      dedupe_field: id
      fields:
        id: id
        name: name
        mime_type: mimeType
        modified_at: modifiedTime
        url: webViewLink
