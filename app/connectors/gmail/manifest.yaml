# T3b — Gmail connector manifest.
#
# Tool surface: list, get, send, draft, search, labels. `list_labels`
# arrived in R43 — the workflow picker offers "one source per user
# label" and could enumerate nothing but INBOX / IMPORTANT / STARRED
# without it. It rides `gmail.readonly`, which already covers labels
# (see scope_descriptions); no new consent.
#
# Channel policy: send_message is mutating (default-deny on voice and
# Telegram via the dispatcher's _MUTATES_DEFAULT_DENY_CHANNELS).
# Reads (list, get, search) allowed everywhere.
manifest_version: 1
id: gmail
name: Gmail
short_description: Read your inbox, search threads, and send messages from your Gmail account.
icon: mail
docs_url: https://developers.google.com/gmail/api
status: stable
category: productivity

oauth:
  provider_app: google
  scopes:
    - https://www.googleapis.com/auth/gmail.readonly
    - https://www.googleapis.com/auth/gmail.send
  scopes_optional:
    # Requested only by the automations connector card in read_write
    # mode (Round 26) — drafts-only writes. Plain chat connects never
    # ask for it.
    - https://www.googleapis.com/auth/gmail.compose
  pkce: true
  refresh: true

scope_descriptions:
  https://www.googleapis.com/auth/gmail.readonly: Read your Gmail messages, threads, and labels.
  https://www.googleapis.com/auth/gmail.send: Send mail on your behalf. We never store the body of messages you send beyond your audit log.
  https://www.googleapis.com/auth/gmail.compose: Create drafts in your Gmail. Automations only ever write drafts — nothing is sent without you.

health:
  probe: gmail__list_messages

tools:
  - name: gmail__list_messages
    description: |
      List recent Gmail messages, optionally filtered by Gmail's search query syntax (e.g. "from:alice newer_than:7d"). Returns full headers + decoded body for every message in ONE call by default — this is what you almost always want. Only set `include_body: false` for the rare bulk-enumeration use case (e.g. counting messages, exporting just ids). For "Nth email" requests (e.g. "summarize my 14th email") set `max_results` to N and pick the Nth from the response — ONE tool call, not list-then-get.
    input_schema:
      type: object
      properties:
        query:
          type: string
          description: Gmail search query syntax. Empty string = inbox.
        max_results:
          type: integer
          minimum: 1
          maximum: 50
          description: Number of messages to return. For "show me my last N emails" or "summarize my Nth email", set this to N (or N+1 for safety). Default 25 covers most "recent emails" asks in one call.
          default: 25
        include_body:
          type: boolean
          description: Defaults to true — returns full headers + plain-text body for every listed message inline (parallel-fetched). Set to false ONLY for bulk-enumeration tasks where bodies aren't needed; in 95% of real asks ("read", "summarize", "show", "what's my Nth email") you want the default.
          default: true
      required: []
    mutates: false
    elevation: false
    output_redaction: ["snippet", "body"]
    pii: medium
    channel_policy:
      default: allow
      deny: []

  - name: gmail__get_message
    description: Fetch the full body, headers, and metadata of one Gmail message by id.
    input_schema:
      type: object
      properties:
        message_id:
          type: string
      required: [message_id]
    mutates: false
    elevation: false
    output_redaction: ["body"]
    pii: high
    channel_policy:
      default: allow
      deny: []

  - name: gmail__list_labels
    description: |
      List the labels in this Gmail account — the three system ones (INBOX, IMPORTANT, STARRED, plus Gmail's category tabs) and every label the user made themselves, each with how many messages it holds and how many are unread. Use this to answer "which labels do I have" or to turn a label NAME the user said into the label id `gmail__list_messages` takes as `label:<id>`.
    input_schema:
      type: object
      properties:
        max_results:
          type: integer
          minimum: 1
          maximum: 100
          description: How many labels to return, system ones first then the user's own by name. Default 50.
          default: 50
        include_counts:
          type: boolean
          description: Defaults to true — adds messages_total and messages_unread to every row. Set false to skip one extra read per label when only the names are wanted.
          default: true
      required: []
    mutates: false
    elevation: false
    output_redaction: []
    pii: low
    channel_policy:
      default: allow
      deny: []

  - name: gmail__send_message
    description: Compose and send a Gmail message. Subject and body are required.
    input_schema:
      type: object
      properties:
        to:
          type: string
          description: Recipient email address.
        subject:
          type: string
        body:
          type: string
        cc:
          type: string
        bcc:
          type: string
      required: [to, subject, body]
    mutates: true
    elevation: true
    output_redaction: ["body", "cc", "bcc"]
    pii: high
    rate_limit: "10/min"
    channel_policy:
      default: allow
      deny: []

  - name: gmail__create_draft
    description: Create a Gmail DRAFT (never sends). The draft appears in the user's Drafts folder for them to review and send themselves. This is the only mail write automations may perform. Can carry files via `attachments` — that is how a one-page PDF, a CSV or a markdown file reaches the user as a FILE rather than as text pasted into the body.
    input_schema:
      type: object
      properties:
        to:
          type: string
          description: Recipient email address.
        subject:
          type: string
        body:
          type: string
        cc:
          type: string
        bcc:
          type: string
        attachments:
          type: array
          maxItems: 3
          description: Files to attach. At most 3, and at most 3 MB decoded in total (Microsoft Graph's inline-attachment ceiling, which the Outlook draft tool shares so a delivery cannot succeed on one mail channel and refuse on the other). A malformed entry refuses the whole draft rather than writing one silently missing its file.
          items:
            type: object
            properties:
              filename:
                type: string
                description: Name the file arrives under, e.g. "brief.pdf".
              content_type:
                type: string
                description: MIME type, e.g. "application/pdf". Defaults to application/octet-stream.
              content_base64:
                type: string
                description: The file's bytes, base64-encoded (standard alphabet, padded).
            required: [filename, content_base64]
      required: [to, subject, body]
    mutates: true
    elevation: false
    output_redaction: ["body", "cc", "bcc", "attachments"]
    pii: high
    rate_limit: "20/min"
    channel_policy:
      default: allow
      deny: []

  - name: gmail__search_threads
    description: Search Gmail threads matching a query, returning thread metadata + first-message snippets.
    input_schema:
      type: object
      properties:
        query:
          type: string
        max_results:
          type: integer
          minimum: 1
          maximum: 25
          default: 10
      required: [query]
    mutates: false
    elevation: false
    output_redaction: ["snippet"]
    pii: medium
    channel_policy:
      default: allow
      deny: []

# ── Automation capability (Round 26) ──────────────────────────────
# Gmail is the ONE push-capable connector: events ride the existing
# Pub/Sub → Trigger pipeline (users.watch, JWT-verified webhook,
# dedupe on gmail_message_id). The only permitted write is
# gmail__create_draft — automations never send mail.
automation:
  push: true
  poll: false
  floor_s: 300
  rate_budget:
    per_hour: 30
    per_day: 200
  scopes_read:
    - https://www.googleapis.com/auth/gmail.readonly
  scopes_write_by_action:
    gmail__create_draft: ["https://www.googleapis.com/auth/gmail.compose"]
  target_param_by_action:
    gmail__create_draft: to
  events:
    - key: email_received
      description: A new email arrives in your inbox.
      dedupe_field: gmail_message_id
      fields:
        message_id: gmail_message_id
        subject: subject
        from: from
        snippet: snippet
    # R43 §7 names three more Gmail events — "someone in my VIPs
    # writes", "an invoice lands", "a thread I pinned gets a reply" —
    # and marks all four `push`. Two of them are declarable and one is
    # not, and NEITHER is declared here yet, on purpose:
    #
    #   All four ride the ONE `users.watch` feed, so each compiles to
    #   its own `Trigger(kind="email_received")` row on the same push.
    #   Declared as they stand, every row fires on every message: four
    #   events turned on would mean four runs per incoming mail, each
    #   claiming a different reason. The narrowing has to be the
    #   TRIGGER's own `filter_json` — which `compiler._compile_bindings_v2`
    #   already copies from `source.filter_rules`, and which
    #   `filter_evaluator.matches_filter` already evaluates
    #   (`from_contains`, `subject_contains`, `labels`,
    #   `exclude_categories`). Both halves of that path exist.
    #
    #   The missing half is the DECLARATION: `AutomationEventSpec` is
    #   `extra="forbid"` with no filter key, `automation_registry()`
    #   ships none, and `workflow.set_triggers` writes no `filter` when
    #   it mints a lane. There is no manifest key that supplies it —
    #   that is a statement about this codebase, not a guess. The exact
    #   three-line addition is in R43's NEEDS; the moment it lands,
    #   `vip_wrote` (from_contains, from the user's own person pins) and
    #   `invoice_landed` (subject_contains) are declarable here as push
    #   events that fire on the mail they name and nothing else.
    #
    #   `pinned_thread_reply` is NOT declarable even then: the filter
    #   vocabulary has no thread predicate and the Pub/Sub push item
    #   carries no thread id, so a row for it could only ever mean
    #   `email_received` under a different name.
    #
    # Declaring them `push: false` and polling instead was the other
    # option and is rejected: §7's frozen table says all four are push,
    # the per-event opt-out `workflow.event_mode` reads
    # (`ev["push"] is False`) is itself unreachable — the registry never
    # serialises a per-event `push` — and turning Gmail into a poll
    # connector would demand a `source_tool` on `email_received`, i.e.
    # giving up the one real push path this platform has to narrow two
    # events it can narrow properly instead.
